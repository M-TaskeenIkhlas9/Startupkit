[project]
name = "startupkit"
version = "0.0.0"
description = "The operating system for founders."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "temporalio>=1.6",
  "anthropic>=0.30",
  "httpx>=0.27",
  "asyncpg>=0.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/startupkit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The sys.path shim (for Vercel's bundled-but-not-installed src/ layout) must run before the
# startupkit imports below it, which ruff's import-position check doesn't have an exception for.
"apps/api/main.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["startupkit"]

# Boundary enforcement — the Python equivalent of the architecture's module rules.
[tool.importlinter]
root_package = "startupkit"

[[tool.importlinter.contracts]]
name = "workflows never import adapters directly"
type = "forbidden"
source_modules = ["startupkit.workflows"]
forbidden_modules = ["startupkit.adapters"]

[[tool.importlinter.contracts]]
name = "adapters depend only on ports"
type = "forbidden"
source_modules = ["startupkit.adapters"]
forbidden_modules = ["startupkit.workflows", "startupkit.core"]

[[tool.importlinter.contracts]]
name = "core never imports workflows or adapters"
type = "forbidden"
source_modules = ["startupkit.core"]
forbidden_modules = ["startupkit.workflows", "startupkit.adapters"]
