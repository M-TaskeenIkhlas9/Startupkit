name: deploy

# Builds + pushes both images on every merge to main. Does NOT deploy anywhere by itself —
# see deploy/README.md for what still needs to be wired up to actually ship a build.

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: .
            dockerfile: apps/api/Dockerfile
          - name: web
            context: apps/web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}

  # TODO(@eng-spine): add the actual deploy step once a host is chosen — e.g. SSH into the box
  # and `docker compose -f deploy/docker-compose.prod.yml pull && up -d`, or a platform action.
